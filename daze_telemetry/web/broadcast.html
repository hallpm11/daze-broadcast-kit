<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,initial-scale=1"><title>Daze of Thunder | Broadcast Team</title><link rel="stylesheet" href="/common.css"></head>
<body class="mode-broadcast" data-mode="broadcast">
  <div class="branding"><img src="/media/daze-logo.png" alt="Daze of Thunder"><div class="brand-copy"><div class="brand-title">BROADCAST TEAM</div><div class="brand-subtitle">DAZE OF THUNDER</div></div></div>
  <div class="session-header" id="session-header"><div class="session-track" id="session-track"></div><div class="session-details" id="session-details"></div></div>
  <div class="status" id="status"><span class="status-dot"></span><span id="status-text">LIVE TELEMETRY</span></div>
  <div class="flag" id="flag"><span class="flag-dot"></span><span id="flag-label"></span></div>
  <div class="standings" id="standings"><div class="standings-head"><div class="standings-label" id="standings-label">RUNNING ORDER</div><div class="standings-accent"></div></div><div class="standings-rows" id="standings-rows"></div></div>

  <div class="bottom-bar"><div class="bottom-tag">DAZE</div><div class="bottom-title">OF THUNDER</div><div class="bottom-secondary">MOTORSPORT BROADCAST</div><div class="bottom-spacer"></div><div class="bottom-web">DAZEOFTHUNDER.COM</div></div>
  <div class="demo-warning" id="demo-warning">DEMO TELEMETRY — NOT LIVE</div>
  <script src="/client.js"></script>
</body></html>
